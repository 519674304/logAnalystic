# 时延阶段层：计算两个关键日志事件（start/end matcher）之间的耗时。
# owner 归属（二选一，不能同时为空或同时存在）：
#   flow 级 stage（flow_id）：自定义起止的时延段，可覆盖一个进程、一个应用多个进程或跨应用，
#     串起完整流程，不限定类别。常见写法：聚合 stage（按 result 拆分支）+ 跨应用 RPC 边界。
#     聚合 stage 用 result 表达结果/异常分支；同 order 的多个 result 分支在定义上都存在，
#     但实际搜索日志时同一 order 只命中一个。
#   进程级 stage（process_id）：描述进程内部时延，进泳道图；可含 sub_process_ids（并行子进程组）。
#
# order 在每个 owner 内独立从 1 编号，仅标记数据。

# ============ FLOW-EXAMPLE（owner = flow，不进泳道图）============

# 聚合：主进程 PROCESS-A-MAIN 整体，结果 SUCCESS（判定请求成功）。
[[stages]]
id = "STAGE-AGG-A"
name = "A 进程整体成功"
business_meaning = "主进程从启动到请求成功完成的整体时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
flow_id = "FLOW-EXAMPLE"
order = 1
result = "SUCCESS"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-REQUEST-SUCCESS"

# 聚合：主进程 PROCESS-A-MAIN 整体，异常结尾（REQ-START -> TIMEOUT），与 SUCCESS 同 order=1 互为互斥结尾。
[[stages]]
id = "STAGE-AGG-A-TIMEOUT"
name = "A 进程整体超时"
business_meaning = "等待子进程超时的异常整体。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
flow_id = "FLOW-EXAMPLE"
order = 1
result = "TIMEOUT"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-TIMEOUT"

# 聚合：PROCESS-B-WORKER 整体（B 收到到 B 完成）。
[[stages]]
id = "STAGE-AGG-B"
name = "B 进程整体"
business_meaning = "B 子进程整体处理时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
flow_id = "FLOW-EXAMPLE"
order = 2
start_matcher_id = "LOG-SUBPROCESS-RECEIVED"
end_matcher_id = "LOG-SUBPROCESS-COMPLETED"

# 聚合：PROCESS-D-WORKER 整体（A 汇总完成后到 D 成功）。
[[stages]]
id = "STAGE-AGG-D"
name = "D 进程整体"
business_meaning = "D 收尾进程整体时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
flow_id = "FLOW-EXAMPLE"
order = 3
start_matcher_id = "LOG-ALL-COMPLETED"
end_matcher_id = "LOG-REQUEST-SUCCESS"

# rpc 调用：A 并行段内发起 → B 应用收到。可选标记，可加多个，由用户挑关键跨应用调用。
[[stages]]
id = "STAGE-RPC-DISPATCH"
name = "A 调度 B"
business_meaning = "A 发起并行调度到 B 收到请求的跨应用时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
flow_id = "FLOW-EXAMPLE"
order = 4
start_matcher_id = "LOG-PARALLEL-START"
end_matcher_id = "LOG-SUBPROCESS-RECEIVED"

# ============ PROCESS-A-MAIN（owner = process，APP-A）============

[[stages]]
id = "STAGE-A"
name = "A 准备阶段"
business_meaning = "主流程收到请求到启动并行子进程的准备时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
process_id = "PROCESS-A-MAIN"
order = 1
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-PARALLEL-START"

# 并行子进程组：A 扇出到 B/C/D 并等待全部完成。sub_process_ids 标记同进程内并行子进程。
[[stages]]
id = "STAGE-P"
name = "A 并行子进程组"
business_meaning = "A 并行调度到全部子进程完成的等待时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
process_id = "PROCESS-A-MAIN"
order = 2
sub_process_ids = ["PROCESS-B-WORKER", "PROCESS-C-WORKER", "PROCESS-D-WORKER"]
start_matcher_id = "LOG-PARALLEL-START"
end_matcher_id = "LOG-ALL-COMPLETED"

# ============ PROCESS-B-WORKER（owner = process，APP-B）============

[[stages]]
id = "STAGE-B"
name = "B 子进程处理"
business_meaning = "子进程收到请求到处理完成的耗时。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
process_id = "PROCESS-B-WORKER"
order = 1
start_matcher_id = "LOG-SUBPROCESS-RECEIVED"
end_matcher_id = "LOG-SUBPROCESS-COMPLETED"

# ============ PROCESS-D-WORKER（owner = process，APP-D）============

# 收尾：A 汇总完成后到 D 成功。start matcher 在 A、end 在 D，跨应用，归属 D 进程泳道。
[[stages]]
id = "STAGE-D"
name = "D 收尾"
business_meaning = "全部子进程完成到请求成功的收尾时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-EXAMPLE"]
process_id = "PROCESS-D-WORKER"
order = 1
start_matcher_id = "LOG-ALL-COMPLETED"
end_matcher_id = "LOG-REQUEST-SUCCESS"

# Rule package entry. The package version identifies the import target.
# The importer validates every declared layer and replaces the entire version atomically.

[rule_set]
id = "RULESET-A-PARALLEL"
name = "A parallel subprocess latency analysis"
schema_version = "1.0"
business_version = "1.1.0"

[package]
format = "split-toml"
container_format = "zip"
version = "1.1.0"
description = "A parallel subprocess latency analysis rule package."

[package.layers]
definitions = "definitions.toml"
matchers = "matchers.toml"
stages = "stages.toml"

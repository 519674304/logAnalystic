# 时延阶段层：计算两个关键日志事件之间的耗时。
# owner：process_id = 进程级（进泳道图）；flow_id = flow 级（不进泳道图）。
#
# flow 级 stage 不限定类别：自定义起止的时延段，可覆盖一个进程、一个应用多个进程或跨应用，串起完整流程。
#   常见写法：
#     聚合 stage：代表一个进程（或多个进程）整体时延；主进程（PROCESS-A-MAIN）聚合按 result 拆 SUCCESS/TIMEOUT 等互斥分支（同 order），判定请求结果。
#     rpc 调用 stage：跨应用调用，start 在调用方并行段内、end 在接收应用的 matcher；可选，可加多个。
#
# 进程级 stage 描述进程内部时延，可含 sub_process_ids（同进程内并行子进程组）。
#   收尾段（A 汇总 → D 成功）起止 matcher 分属 A/D，归属 D 进程泳道，跨应用是合法的。
#
# order 在每个 owner 内独立从 1 编号，仅标记数据。

# ============ FLOW-SMOKE（owner = flow，不进泳道图）============

# 聚合：主进程 PROCESS-A-MAIN 整体，结果 SUCCESS（判定请求成功）。
# export_enabled=false 使 flow 聚合不计入逐阶段样本，保持冒烟 25 样本通过标准。
[[stages]]
id = "STAGE-AGG-A"
name = "A 进程整体成功"
business_meaning = "主进程从启动到请求成功完成的整体时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
order = 1
result = "SUCCESS"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-REQUEST-SUCCESS"

# 聚合：主进程 PROCESS-A-MAIN 整体，异常结尾（REQ-START -> TIMEOUT），与 SUCCESS 同 order=1 互为互斥结尾。
[[stages]]
id = "STAGE-AGG-A-TIMEOUT"
name = "A 进程整体超时"
business_meaning = "等待子进程超时的异常整体。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
order = 1
result = "TIMEOUT"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-TIMEOUT"

# 聚合：PROCESS-B-WORKER 整体（B 收到到 B 完成）。
[[stages]]
id = "STAGE-AGG-B"
name = "B 进程整体"
business_meaning = "B 子进程整体处理时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
order = 2
start_matcher_id = "LOG-SUBPROCESS-RECEIVED"
end_matcher_id = "LOG-SUBPROCESS-COMPLETED"

# 聚合：PROCESS-D-WORKER 整体（A 汇总完成后到 D 成功）。
[[stages]]
id = "STAGE-AGG-D"
name = "D 进程整体"
business_meaning = "D 收尾进程整体时延。"
enabled = true
export_enabled = false
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
order = 3
start_matcher_id = "LOG-ALL-COMPLETED"
end_matcher_id = "LOG-REQUEST-SUCCESS"

# rpc 调用：A 并行段内发起 → B 应用收到。可选标记，可加多个，由用户挑关键跨应用调用。
[[stages]]
id = "STAGE-RPC-DISPATCH"
name = "A 调度 B"
business_meaning = "A 发起并行调度到 B 收到请求的跨应用时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
order = 4
start_matcher_id = "LOG-PARALLEL-START"
end_matcher_id = "LOG-SUBPROCESS-RECEIVED"

# ============ PROCESS-A-MAIN（owner = process，APP-A）============

[[stages]]
id = "STAGE-A"
name = "A 准备阶段"
business_meaning = "主流程收到请求到启动并行子进程的准备时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-A-MAIN"
order = 1
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-PARALLEL-START"

# 并行子进程组：A 扇出到 B/C/D 并等待全部完成。sub_process_ids 标记同进程内并行子进程。
[[stages]]
id = "STAGE-P"
name = "A 并行子进程组"
business_meaning = "A 并行调度到全部子进程完成的等待时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-A-MAIN"
order = 2
sub_process_ids = ["PROCESS-B-WORKER", "PROCESS-C-WORKER", "PROCESS-D-WORKER"]
start_matcher_id = "LOG-PARALLEL-START"
end_matcher_id = "LOG-ALL-COMPLETED"

# ============ PROCESS-B-WORKER（owner = process，APP-B）============

# 普通 stage 多 end 演示：end_matcher_ids 配两个冗余结束 matcher，命中任一即闭合。
# 第 4 个请求（fixture 里）只输出「subprocess finished」，缺失「subprocess completed」，
# 验证端侧日志丢失时该 stage 仍能正确闭合（命中 LOG-SUBPROCESS-FINISHED）。
[[stages]]
id = "STAGE-B"
name = "B 子进程处理"
business_meaning = "子进程收到请求到处理完成的耗时；结束事件有两个冗余 matcher，命中其一即闭合。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-B-WORKER"
order = 1
start_matcher_id = "LOG-SUBPROCESS-RECEIVED"
end_matcher_ids = ["LOG-SUBPROCESS-COMPLETED", "LOG-SUBPROCESS-FINISHED"]

# ============ PROCESS-D-WORKER（owner = process，APP-D）============

# 收尾：A 汇总完成后到 D 成功。start matcher 在 A、end 在 D，跨应用，归属 D 进程泳道。
[[stages]]
id = "STAGE-D"
name = "D 收尾"
business_meaning = "全部子进程完成到请求成功的收尾时延。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-D-WORKER"
order = 1
start_matcher_id = "LOG-ALL-COMPLETED"
end_matcher_id = "LOG-REQUEST-SUCCESS"

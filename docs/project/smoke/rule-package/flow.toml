[business_flow]
id = "FLOW-SMOKE"
name = "冒烟主链路流程"
domain_id = "DOMAIN-SMOKE"
root_process_id = "PROCESS-A-MAIN"
request_start_matcher_id = "LOG-REQUEST-START"
process_ids = ["PROCESS-A-MAIN", "PROCESS-B-WORKER", "PROCESS-C-WORKER", "PROCESS-D-WORKER"]

[business_flow.matching]
strategy = "ordered_first_match"

[[business_flow.end_results]]
result = "SUCCESS"
matcher_id = "LOG-REQUEST-SUCCESS"

[[business_flow.end_results]]
result = "TIMEOUT"
matcher_id = "LOG-TIMEOUT"

[[business_flow.branches]]
id = "BRANCH-SUCCESS"
name = "成功主路径"
default = true
stage_ids = ["STAGE-PREPARE", "STAGE-DISPATCH", "STAGE-SUBPROCESS-PROCESS", "STAGE-JOIN", "STAGE-FINALIZE"]

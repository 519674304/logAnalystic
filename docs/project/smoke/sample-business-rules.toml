[rule_set]
id = "SMOKE-RULESET"
name = "Smoke test rules"
schema_version = "1.0"
business_version = "1.0.0"

[[scenarios]]
id = "SCENARIO-SMOKE"
name = "Smoke scenario"
description = "Use the bundled sample log to verify search, request recognition, latency analysis, and CSV export."

[[domains]]
id = "DOMAIN-SMOKE"
name = "Smoke domain"
description = "Minimal domain for smoke testing."

[[applications]]
id = "APP-A"
name = "A app"
log_prefix = "A00010"

[[applications]]
id = "APP-B"
name = "B app"
log_prefix = "B00020"

[[applications]]
id = "APP-C"
name = "C app"
log_prefix = "C00030"

[[processes]]
id = "PROCESS-A-MAIN"
name = "A main process"
kind = "MAIN"
application_id = "APP-A"

[[processes]]
id = "PROCESS-B-HANDLE"
name = "B handle process"
kind = "SUB"
application_id = "APP-B"
parent_process_id = "PROCESS-A-MAIN"

[[processes]]
id = "PROCESS-C-HANDLE"
name = "C handle process"
kind = "SUB"
application_id = "APP-C"
parent_process_id = "PROCESS-A-MAIN"

[[log_matchers]]
id = "LOG-REQUEST-START"
name = "Request start"
business_meaning = "Global request start marker"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-A"
type = "keyword"
pattern = "request started"

[[log_matchers]]
id = "LOG-A-PARALLEL-START"
name = "Start parallel subprocesses"
business_meaning = "A starts the parallel work"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-A"
type = "keyword"
pattern = "start parallel subprocesses"

[[log_matchers]]
id = "LOG-B-RECEIVED"
name = "B received"
business_meaning = "B subprocess received the request"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-B"
type = "regex"
pattern = 'B subprocess received, sequence=[0-9]+'

[[log_matchers]]
id = "LOG-C-RECEIVED"
name = "C received"
business_meaning = "C subprocess received the request"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-C"
type = "regex"
pattern = 'C subprocess received, sequence=[0-9]+'

[[log_matchers]]
id = "LOG-B-COMPLETED"
name = "B completed"
business_meaning = "B subprocess completed"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-B"
type = "keyword"
pattern = "B subprocess completed"

[[log_matchers]]
id = "LOG-C-COMPLETED"
name = "C completed"
business_meaning = "C subprocess completed"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-C"
type = "keyword"
pattern = "C subprocess completed"

[[log_matchers]]
id = "LOG-A-ALL-SUBPROCESSES-COMPLETED"
name = "Parallel join"
business_meaning = "A checks that all subprocesses completed"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-A"
type = "keyword"
pattern = "all subprocesses completed"

[[log_matchers]]
id = "LOG-REQUEST-SUCCESS"
name = "Request success"
business_meaning = "Global request completed successfully"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
application_id = "APP-A"
type = "keyword"
pattern = "request completed successfully"

# 开始边界（owner = flow）
[[stages]]
id = "STAGE-REQUEST-START"
name = "Request start"
business_meaning = "Global request start marker"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
role = "start"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-REQUEST-START"
order = 1

# 普通 stage：A 准备
[[stages]]
id = "DEF-A-PREPARE"
name = "A preparation stage"
business_meaning = "A starts the request and prepares work"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-A-MAIN"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-A-PARALLEL-START"
order = 2

# 特殊 stage：A 到 B 的 RPC（owner = flow）
[[stages]]
id = "DEF-A-TO-B-RPC"
name = "A to B RPC latency"
business_meaning = "A starts B and waits for B to receive the request"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
start_matcher_id = "LOG-A-PARALLEL-START"
end_matcher_id = "LOG-B-RECEIVED"
order = 3

# 特殊 stage：A 到 C 的 RPC（owner = flow，与 A->B 同 order 并发）
[[stages]]
id = "DEF-A-TO-C-RPC"
name = "A to C RPC latency"
business_meaning = "A starts C and waits for C to receive the request"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
start_matcher_id = "LOG-A-PARALLEL-START"
end_matcher_id = "LOG-C-RECEIVED"
order = 3

# 普通 stage：B 处理
[[stages]]
id = "DEF-B-PROCESS"
name = "B processing stage"
business_meaning = "B processing time"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-B-HANDLE"
start_matcher_id = "LOG-B-RECEIVED"
end_matcher_id = "LOG-B-COMPLETED"
order = 4

# 普通 stage：C 处理（与 B 处理同 order 并发）
[[stages]]
id = "DEF-C-PROCESS"
name = "C processing stage"
business_meaning = "C processing time"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-C-HANDLE"
start_matcher_id = "LOG-C-RECEIVED"
end_matcher_id = "LOG-C-COMPLETED"
order = 4

# 特殊 stage：跨子进程并行（owner = flow，sub_process_ids 列出跨过的子进程）
[[stages]]
id = "DEF-PARALLEL-GROUP"
name = "Parallel subprocess group"
business_meaning = "All parallel subprocesses complete"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
sub_process_ids = ["PROCESS-B-HANDLE", "PROCESS-C-HANDLE"]
start_matcher_id = "LOG-A-PARALLEL-START"
end_matcher_id = "LOG-A-ALL-SUBPROCESSES-COMPLETED"
order = 5

# 普通 stage：A 收尾
[[stages]]
id = "DEF-A-FINALIZE"
name = "A finalization stage"
business_meaning = "A wraps up after all subprocesses complete"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
process_id = "PROCESS-A-MAIN"
start_matcher_id = "LOG-A-ALL-SUBPROCESSES-COMPLETED"
end_matcher_id = "LOG-REQUEST-SUCCESS"
order = 6

# 结束边界（owner = flow）：成功结尾
[[stages]]
id = "STAGE-SUCCESS"
name = "Request success"
business_meaning = "Global request completed successfully"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-SMOKE"]
flow_id = "FLOW-SMOKE"
role = "end"
result = "SUCCESS"
start_matcher_id = "LOG-REQUEST-START"
end_matcher_id = "LOG-REQUEST-SUCCESS"
order = 7

[[flows]]
id = "FLOW-SMOKE"
name = "Smoke flow"
domain_id = "DOMAIN-SMOKE"
root_process_id = "PROCESS-A-MAIN"
process_ids = ["PROCESS-A-MAIN", "PROCESS-B-HANDLE", "PROCESS-C-HANDLE"]

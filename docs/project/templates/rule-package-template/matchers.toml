# 日志匹配器层：把原始日志文本映射为业务事件。
# application_id 引用 definitions.toml 的 applications.id；一个进程的所有 matcher 与应用同属一个应用。
# 可被多个 stage 复用（例如 LOG-PAY-CALL 同时是 flow 聚合 end 与 PROCESS-ORDER-MAIN 内部 stage 的 end）。

# ---------- 订单服务（APP-ORDER）----------
[[log_matchers]]
id = "LOG-ORDER-START"
name = "订单开始"
business_meaning = "订单服务收到请求并启动主流程。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-ORDER"
type = "keyword"
pattern = "order request started"

[[log_matchers]]
id = "LOG-ORDER-ERROR"
name = "订单异常"
business_meaning = "订单主流程异常结束。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-ORDER"
type = "keyword"
pattern = "order request error"

# 拦截日志：种类很多，各自匹配，被 intercept stage 的 end_matcher_ids 一并引用。
[[log_matchers]]
id = "LOG-REJECT-AUTH"
name = "鉴权拦截"
business_meaning = "请求因鉴权失败被拦截。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-ORDER"
type = "keyword"
pattern = "order auth rejected"

[[log_matchers]]
id = "LOG-REJECT-QUOTA"
name = "限流拦截"
business_meaning = "请求因限流/降级被拦截。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-ORDER"
type = "keyword"
pattern = "order quota rejected"

[[log_matchers]]
id = "LOG-PAY-CALL"
name = "发起支付调用"
business_meaning = "订单服务发起对支付服务的跨应用调用。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-ORDER"
type = "keyword"
pattern = "pay call out"

# ---------- 支付服务（APP-PAYMENT）----------
[[log_matchers]]
id = "LOG-PAY-RECEIVED"
name = "支付开始"
business_meaning = "支付服务收到订单支付请求。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-PAYMENT"
type = "keyword"
pattern = "payment request received"

[[log_matchers]]
id = "LOG-PAY-DONE"
name = "支付完成"
business_meaning = "支付服务完成支付处理。"
enabled = true
export_enabled = true
applicable_scenario_ids = ["SCENARIO-TEMPLATE"]
application_id = "APP-PAYMENT"
type = "keyword"
pattern = "payment completed"

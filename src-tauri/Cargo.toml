[package]
name = "log_analystic_tauri"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tauri = { version = "1", features = ["dialog-open"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1"
serde_json = "1"
toml = "0.8"
toml_edit = "0.25.13"
zip = "8.6.0"

[build-dependencies]
tauri-build = { version = "1", features = [] }
